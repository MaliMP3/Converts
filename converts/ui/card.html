<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Converts</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171717;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      user-select: none;
      overflow: hidden;
    }
    #card {
      height: 100%;
      box-sizing: border-box;
      padding: 8px 10px 8px 9px;
      color: #f4f4f4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 3px solid #3fd4ff;
    }
    #card.done { border-left-color: #7dffa8; }
    #card.bad { border-left-color: #ff8d8d; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 16px;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3fd4ff;
    }
    #card.done .dot { background: #7dffa8; }
    #card.bad .dot { background: #ff8d8d; }
    button.x {
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    #title {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #file {
      font-size: 11px;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: text;
    }
    .track {
      height: 3px;
      margin-top: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: #3fd4ff;
      animation: slide 1.1s ease-in-out infinite;
    }
    #card.done .track, #card.bad .track { display: none; }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
    .actions {
      display: none;
      gap: 6px;
      margin-top: auto;
      justify-content: flex-end;
    }
    #card.done .actions { display: flex; }
    .actions button {
      border: 0;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 7px;
      padding: 4px 8px;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
    }
    #card.done #open-file { background: #3fd4ff; color: #102027; }
    .actions button:hover { background: rgba(255, 255, 255, 0.18); }
    #card.done #open-file:hover { background: #67e0ff; }
  </style>
</head>
<body>
  <div id="card">
    <div class="top">
      <div class="badge"><span class="dot"></span><span id="mode">Em segundo plano</span></div>
      <button class="x" id="close" type="button" aria-label="Fechar">×</button>
    </div>
    <div id="title">Convertendo</div>
    <div id="file"></div>
    <div class="track"><div class="bar"></div></div>
    <div class="actions">
      <button id="open-file" type="button">Abrir arquivo</button>
      <button id="open" type="button">Abrir pasta</button>
    </div>
  </div>
  <script>
    const card = document.getElementById('card');
    const title = document.getElementById('title');
    const file = document.getElementById('file');
    const mode = document.getElementById('mode');

    function render(state) {
      card.classList.remove('done', 'bad');
      if (state.phase === 'done') card.classList.add('done');
      if (state.phase === 'error') card.classList.add('bad');
      title.textContent = state.title || 'Convertendo';
      file.textContent = state.file || '';
      mode.textContent = state.phase === 'run' ? 'Em segundo plano' : state.phase === 'done' ? 'Pronto' : 'Não deu certo';
    }

    document.getElementById('close').addEventListener('click', () => window.converts.dismissCard());
    document.getElementById('open').addEventListener('click', () => window.converts.openResult());
    document.getElementById('open-file').addEventListener('click', () => window.converts.openFile());
    if (window.converts && window.converts.onCard) window.converts.onCard(render);
  </script>
</body>
</html>
